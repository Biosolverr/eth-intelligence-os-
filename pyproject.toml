[project]
name = "eth-intelligence-os"
version = "0.3.0"
description = "GenLayer-native ETH analytical protocol: verdict, outcome ledger and analyst bounty Intelligent Contracts, with a read-mostly client"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "genlayer-py>=0.16",
]

[project.optional-dependencies]
dev = [
    "genlayer-test>=0.29",
    "genvm-linter",
    "pytest",
]
legacy = [
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.scripts]
eth-analyze = "core:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["core"]

[tool.setuptools.packages.find]
include = ["engine*", "client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
